    <!-- Interactive Track Filtering Script -->
    <script>
        const audio = document.getElementById('trackAudio');
        const vinyl = document.getElementById('vinylRecord');
        const playBtn = document.getElementById('vinylPlayBtn');

        if (audio && vinyl && playBtn) {
            // Toggle play/pause when center button is clicked
            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            });

            // Update UI when audio starts playing
            audio.addEventListener('play', () => {
                vinyl.classList.add('is-playing');
                playBtn.classList.add('is-playing');
                playBtn.innerHTML = '&#10074;&#10074;'; // Pause icon
            });

            // Update UI when audio pauses
            audio.addEventListener('pause', () => {
                vinyl.classList.remove('is-playing');
                playBtn.classList.remove('is-playing');
                playBtn.innerHTML = '&#9654;'; // Play icon
            });

            // Update UI when track finishes
            audio.addEventListener('ended', () => {
                vinyl.classList.remove('is-playing');
                playBtn.classList.remove('is-playing');
                playBtn.innerHTML = '&#9654;';
            });
        }
    </script>
