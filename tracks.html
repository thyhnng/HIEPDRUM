<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tracks | HIEP DRUM</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="header tracks-header">
        <div class="navbar-wrapper">
            <div class="container navbar">
                <div class="logo">
                    <a href="index.html#home"><img src="images/logo.png" alt="Hiep Drum Logo" width="120"></a>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html#home">Home</a></li>
                        <li><a href="tracks.html" class="active">Tracks</a></li>
                        <li><a href="index.html#about">About</a></li>
                        <li><a href="index.html#contact">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main All Tracks Content -->
    <main class="all-tracks-page">
        <div class="container">
            <div class="page-title-box">
                <h1 class="section-title">CURRENT TRACKS</h1>
                <p class="subtitle">ALL REMIXES AVAILABLE</p>
            </div>

            <!-- Search Bar -->
            <div class="tracks-filter-bar">
                <input type="text" id="trackSearch" placeholder="Search track name..." onkeyup="filterTracks()">
            </div>

            <!-- Full Tracks Grid -->
            <div class="tracks-page-grid" id="allTracksGrid">

                <!-- Track 1 -->
                <div class="vinyl-card track-item" data-title="ai khoc noi dau nay">
                    <a href="track-detail.html?track=ai-khoc-noi-dau-nay" class="vinyl-card-link">
                        <div class="sleeve">
                            <h3>Ai Khoc Noi Dau Nay</h3>
                            <p>Hiep Drum (2026)</p>
                        </div>
                        <img src="images/disc.png" alt="Ai Khoc Noi Dau Nay Disc" class="disc">
                    </a>
                </div>

                <!-- Track 2 -->
                <div class="vinyl-card track-item" data-title="stereo love">
                    <a href="track-detail.html?track=stereo-love" class="vinyl-card-link">
                        <div class="sleeve">
                            <h3>Stereo Love</h3>
                            <p>Hiep Drum (2026)</p>
                        </div>
                        <img src="images/disc.png" alt="Stereo Love Disc" class="disc">
                    </a>
                </div>

                <!-- Track 3 -->
                <div class="vinyl-card track-item" data-title="i like it">
                    <a href="track-detail.html?track=i-like-it" class="vinyl-card-link">
                        <div class="sleeve">
                            <h3>I Like It</h3>
                            <p>Hiep Drum (2026)</p>
                        </div>
                        <img src="images/disc.png" alt="I Like It Disc" class="disc">
                    </a>
                </div>

                <!-- Track 4 -->
                <div class="vinyl-card track-item" data-title="feel good inc">
                    <a href="track-detail.html?track=feel-good-inc" class="vinyl-card-link">
                        <div class="sleeve">
                            <h3>Feel Good INC</h3>
                            <p>Hiep Drum (2026)</p>
                        </div>
                        <img src="images/disc.png" alt="Feel Good INC Disc" class="disc">
                    </a>
                </div>
                
            </div>

            <div class="back-home-container">
                <a href="index.html#home" class="tracks-btn">&larr; Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="copyright">
        <p>&copy; 2026 Hiep Drum. All rights reserved.</p>
    </footer>

    <!-- Interactive Track Filtering Script -->
    <script>
        function filterTracks() {
            const input = document.getElementById('trackSearch').value.toLowerCase();
            const grid = document.getElementById('allTracksGrid');
            const items = grid.getElementsByClassName('track-item');

            for (let i = 0; i < items.length; i++) {
                const title = items[i].getAttribute('data-title');
                if (title.includes(input)) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
